name=EcclesGUI
version=1.0.0
author=Nwobodo Ecclesiastes
maintainer=Nwobodo Ecclesiastes <igwestarking21@gmail.com>
sentence=Ultra low RAM UI engine for microcontrollers: 2D widgets and a software 3D renderer, no framebuffer.
paragraph=Plain C99 band renderer: it keeps a widget tree and a few dirty rectangles and redraws only what changed, a few lines at a time, into a small buffer you hand to your display driver. Anti aliased rounded rects, gradients, shadows, arcs, text (built in font + your own), images, touch input, animations and a fixed point 3D rasteriser (flat, smooth, textured, wireframe, optional z buffer). No heap, no floats, no libm. About 7 KB of state plus a band buffer you size yourself.
category=Display
