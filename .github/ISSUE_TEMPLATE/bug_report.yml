name: Bug report
description: Something misbehaves (wrong picture, crash, build error, wrong touch behaviour, bad performance on your board)
labels: [bug]
body:
  - type: input
    id: target
    attributes:
      label: Board and toolchain
      description: Chip/board, SDK or core version, compiler and version
      placeholder: "ESP32-S3, Arduino-ESP32 3.0.5, xtensa-esp32s3-elf-gcc 12.2"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Every ECCLES_GUI_* macro you set (or "defaults")
      render: c
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest program that shows it
      description: The panel size, the band buffer size, and the calls (widgets, draw calls) that go wrong. A host program that writes a .ppm is ideal.
      render: c
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Result of eccles_gui_error_name(eccles_gui_last_error(gui))
      description: Include eccles_gui_last_error_str(gui) if it is not empty
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
